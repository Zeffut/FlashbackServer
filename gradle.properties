group=dev.zeffut
version=1.2.0

# Discover JDKs from standard local/CI environment variables, rather than
# developer-specific absolute paths. nms:v26_2 requires Java 25; the remaining
# modules use Java 21.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.fromEnv=JAVA_HOME,JAVA21_HOME,JAVA25_HOME,JAVA_HOME_21_X64,JAVA_HOME_25_X64
