name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Temurin 21
        id: jdk21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Temurin 25
        id: jdk25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify adapters, unit tests, and Paper 26.2 smoke test
        env:
          JAVA21_HOME: ${{ steps.jdk21.outputs.path }}
          JAVA25_HOME: ${{ steps.jdk25.outputs.path }}
        run: ./gradlew clean :nms:v26_2:build :core:test integrationTest --no-daemon