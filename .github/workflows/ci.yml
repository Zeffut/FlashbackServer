name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Temurin 21
        id: jdk21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Temurin 25
        id: jdk25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify adapters, unit tests, and focused Paper 26.x smoke tests
        env:
          JAVA21_HOME: ${{ steps.jdk21.outputs.path }}
          JAVA25_HOME: ${{ steps.jdk25.outputs.path }}
        run: ./gradlew clean :nms:v26_2:build :nms:v26_3:build :core:test paper26_2Smoke paper26_3Smoke --no-daemon
      - name: Preserve unit and smoke test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flashbackserver-test-results
          path: |
            core/build/test-results/test/
            build/test-results/paper26_2Smoke/
            build/test-results/paper26_3Smoke/
          if-no-files-found: warn
          retention-days: 7